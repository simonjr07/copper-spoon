name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: copper_spoon_ci
          POSTGRES_PASSWORD: copper_spoon_ci_password
          POSTGRES_DB: copper_spoon_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U copper_spoon_ci -d copper_spoon_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgresql://copper_spoon_ci:copper_spoon_ci_password@127.0.0.1:5432/copper_spoon_ci?schema=public
      DIRECT_URL: postgresql://copper_spoon_ci:copper_spoon_ci_password@127.0.0.1:5432/copper_spoon_ci?schema=public
      DATABASE_POOL_MAX: "2"
      AUTH_SECRET: ci-only-auth-secret-with-at-least-32-characters
      AUTH_URL: http://localhost:3000
      RATE_LIMIT_SECRET: ci-only-rate-limit-secret-with-at-least-32-characters

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Generate Prisma Client
        run: npm run db:generate

      - name: Validate Prisma schema
        run: npm run db:validate

      - name: Apply migrations to ephemeral PostgreSQL
        run: npm run db:deploy

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: Build
        run: npm run build
